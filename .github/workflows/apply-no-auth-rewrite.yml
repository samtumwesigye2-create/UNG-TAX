name: Apply no-auth rewrite
on:
  push:
    branches: [rewrite-no-auth]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-no-auth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Complete direct-access rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          direct_user = '_OPEN_USER = {"id": "promet-direct", "role": "revenue_operations"}\n'

          # Revenue operations.
          p=Path('ops.py'); s=p.read_text()
          s=s.replace('from fastapi import APIRouter, Depends, HTTPException, Query','from fastapi import APIRouter, HTTPException, Query')
          s=s.replace('\nimport auth\n','\n').replace('from ops_auth import require_revenue_user\n','')
          s=re.sub(r'\n\ndef _revenue_user\(user=Depends\(auth\.require_auth\)\):\n    return require_revenue_user\(user\)\n','\n\n'+direct_user,s,count=1)
          s=s.replace('user=Depends(_revenue_user)','user=_OPEN_USER')
          p.write_text(s)

          # Filing API: direct access. Keep encrypted tax-ID storage independent of authentication.
          p=Path('tax_filing.py'); s=p.read_text()
          s=s.replace('from fastapi import APIRouter, HTTPException, Depends, UploadFile, File, Form','from fastapi import APIRouter, HTTPException, UploadFile, File, Form')
          s=s.replace('\nimport auth\n','\n')
          s=s.replace('user=Depends(auth.require_auth)','user=_OPEN_USER')
          marker='router = APIRouter(prefix="/tax", tags=["tax-filing"])\n'
          helpers='''\n_OPEN_USER = {"id": "promet-direct", "role": "direct_access"}\n\ndef _field_key():\n    import base64, hashlib\n    seed = os.environ.get("TAX_FIELD_KEY", "ura-promet-local-field-key").encode()\n    return base64.urlsafe_b64encode(hashlib.sha256(seed).digest())\n\ndef _encrypt_field(value: str) -> str:\n    from cryptography.fernet import Fernet\n    return Fernet(_field_key()).encrypt(value.encode()).decode()\n\ndef _decrypt_field(value: str) -> str:\n    from cryptography.fernet import Fernet\n    return Fernet(_field_key()).decrypt(value.encode()).decode()\n'''
          if '_OPEN_USER =' not in s:
              s=s.replace(marker,marker+helpers)
          s=s.replace('auth.encrypt_field(', '_encrypt_field(').replace('auth.decrypt_field(', '_decrypt_field(')
          p.write_text(s)

          # Advanced API: direct access. Remove account-table coupling from collaboration/audit views.
          p=Path('tax_advanced.py'); s=p.read_text()
          s=s.replace('from fastapi import APIRouter, HTTPException, Depends','from fastapi import APIRouter, HTTPException')
          s=s.replace('\nimport auth\n','\n').replace('user=Depends(auth.require_auth)','user=_OPEN_USER')
          marker='router = APIRouter(prefix="/tax", tags=["tax-advanced"])\n'
          if '_OPEN_USER =' not in s:
              s=s.replace(marker,marker+'\n_OPEN_USER = {"id": "promet-direct", "role": "direct_access"}\n')
          # Direct-access collaboration no longer depends on auth_users.
          s=re.sub(r'    invitee = c\.execute\("SELECT id FROM auth_users WHERE email=\?", \(body\.collaborator_email\.strip\(\)\.lower\(\),\)\)\.fetchone\(\)\n    if not invitee:\n        c\.close\(\)\n        raise HTTPException\(404, "No account found with that email — they need to register first"\)\n', '    invitee_id = "direct:" + hashlib.sha256(body.collaborator_email.strip().lower().encode()).hexdigest()[:24]\n', s)
          s=s.replace('invitee["id"]', 'invitee_id')
          s=s.replace('''SELECT tc.role, tc.added_at, au.email\n                         FROM tax_collaborators tc JOIN auth_users au ON au.id = tc.user_id\n                         WHERE tc.return_id=?''','''SELECT tc.role, tc.added_at, tc.user_id as collaborator_id\n                         FROM tax_collaborators tc WHERE tc.return_id=?''')
          s=s.replace('''SELECT tal.action, tal.detail, tal.created_at, au.email as actor_email\n                         FROM tax_audit_log tal LEFT JOIN auth_users au ON au.id = tal.actor_user_id\n                         WHERE tal.return_id=? ORDER BY tal.created_at''','''SELECT tal.action, tal.detail, tal.created_at, tal.actor_user_id as actor_id\n                         FROM tax_audit_log tal WHERE tal.return_id=? ORDER BY tal.created_at''')
          p.write_text(s)

          # Delete the authentication/MFA/password-reset implementation and its feature tests.
          for f in ('auth.py','auth_store.py','auth_migrate.py','mfa_ui.py','password_reset.py','password_reset_ui.py','ops_auth.py','static/ops-password-reset.js'):
              Path(f).unlink(missing_ok=True)
          for f in ('tests/test_auth.py','tests/test_auth_bootstrap.py','tests/test_auth_email_transport.py','tests/test_auth_finalization.py','tests/test_auth_store.py','tests/test_filing_mfa_ui.py','tests/test_password_reset_store.py','tests/test_password_reset_transport.py','tests/test_password_reset_ui.py','tests/test_taxpayer_mfa_transport.py'):
              Path(f).unlink(missing_ok=True)

          # Portal tests now verify direct-access behavior instead of deleted role authentication.
          Path('tests/test_role_portals.py').write_text('''from fastapi.testclient import TestClient\nfrom main import app\n\nclient = TestClient(app)\n\ndef test_taxpayer_portal_uses_ura_promet_brand():\n    r=client.get("/taxpayer"); assert r.status_code==200; assert "URA-PROMET" in r.text; assert "Taxpayer Portal" in r.text\n\ndef test_revenue_staff_workspace_exists():\n    r=client.get("/revenue-staff"); assert r.status_code==200; assert "Revenue Staff" in r.text; assert "Return Review" in r.text; assert "Compliance" in r.text\n\ndef test_revenue_admin_workspace_has_admin_functions():\n    r=client.get("/revenue"); assert r.status_code==200; assert "URA-PROMET" in r.text; assert "Revenue Admin" in r.text; assert "Staff Management" in r.text; assert "Role &amp; Permission Management" in r.text; assert "System Settings" in r.text; assert "Audit Log" in r.text\n\ndef test_health_reports_direct_access():\n    r=client.get("/health"); assert r.status_code==200; b=r.json(); assert b["service"]=="URA-PROMET"; assert b["access"]=="direct"\n\ndef test_auth_routes_are_absent():\n    assert client.post("/auth/login", json={}).status_code == 404\n''')

          Path('tests/test_ops_notices.py').write_text('''from fastapi.testclient import TestClient\n\ndef test_issued_notice_content_is_immutable_and_replacement_supported():\n    from main import app\n    client=TestClient(app)\n    r=client.post("/ops/notices",json={"taxpayer_id":"tp-notice","notice_type":"assessment","subject":"Assessment issued","content":"Original notice"}); assert r.status_code==201\n    nid=r.json()["id"]\n    assert client.patch(f"/ops/notices/{nid}",json={"status":"approved"}).status_code==200\n    issued=client.patch(f"/ops/notices/{nid}",json={"status":"issued"}); assert issued.status_code==200; assert issued.json()["issued_by"]=="promet-direct"\n    assert client.patch(f"/ops/notices/{nid}",json={"content":"Changed after issue"}).status_code==409\n''')
          PY
      - name: Persist rewrite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'refactor: complete direct-access URA-PROMET rewrite'
          git push origin rewrite-no-auth
      - name: Verify authentication stack is absent
        run: |
          for f in auth.py auth_store.py auth_migrate.py mfa_ui.py password_reset.py password_reset_ui.py ops_auth.py; do test ! -e "$f"; done
          ! grep -R -n -E 'import auth|require_auth|require_revenue_user|Depends\(_revenue_user\)|Depends\(auth\.|auth_users|password_reset|mfa_ui|auth_store|auth_migrate' --include='*.py' --exclude='test_*' .
      - name: Run complete test suite
        run: |
          python -m pip install -r requirements.txt
          pytest -q
