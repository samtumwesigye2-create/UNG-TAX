name: Apply no-auth rewrite
on:
  push:
    branches: [rewrite-no-auth]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite-no-auth
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove authentication dependencies
        run: |
          python - <<'PY'
          from pathlib import Path

          open_user = '_OPEN_USER = {"id": "direct-access", "role": "revenue_admin"}\n'
          for filename in ('ops.py', 'ops_cases_notices.py', 'ops_reports.py'):
              p = Path(filename)
              s = p.read_text()
              s = s.replace('from fastapi import APIRouter, Depends, HTTPException, Query', 'from fastapi import APIRouter, HTTPException, Query')
              s = s.replace('from fastapi import APIRouter, Depends, HTTPException', 'from fastapi import APIRouter, HTTPException')
              s = s.replace('\nimport auth\n', '\n')
              s = s.replace('from ops_auth import require_revenue_user\n', '')
              start = s.find('def _revenue_user(')
              if start >= 0:
                  end = s.find('\n\ndef ', start)
                  if end < 0:
                      end = s.find('\n\n@', start)
                  s = s[:start] + open_user + s[end+2:]
              s = s.replace('user=Depends(_revenue_user)', 'user=_OPEN_USER')
              p.write_text(s)

          for filename in ('auth.py','auth_store.py','auth_migrate.py','mfa_ui.py','password_reset.py','password_reset_ui.py','ops_auth.py'):
              Path(filename).unlink(missing_ok=True)
          Path('static/ops-password-reset.js').unlink(missing_ok=True)
          PY
      - name: Verify no runtime auth imports remain
        run: |
          ! grep -R -n -E 'import auth|require_auth|require_revenue_user|password_reset|mfa_ui|auth_store|auth_migrate' --include='*.py' --exclude='test_*' .
      - name: Run tests
        run: |
          python -m pip install -r requirements.txt
          pytest -q
      - name: Commit rewrite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m 'refactor: remove authentication stack from URA-PROMET'
          git push origin rewrite-no-auth
