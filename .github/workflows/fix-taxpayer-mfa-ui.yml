# one-time verified patch; remove after green CI
name: Apply taxpayer MFA UI fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-taxpayer-mfa-ui.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch taxpayer MFA UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/index.html')
          s = p.read_text()
          old_endpoint = 'AUTH_API + "/mfa/login-verify"'
          assert old_endpoint in s
          s = s.replace(old_endpoint, 'AUTH_API + "/mfa/verify"', 1)
          old_heading = '$("authHeading").textContent = "Enter your authenticator code";'
          assert old_heading in s
          new_heading = '''if (data.mfa_method==='email_otp'){
        $("authHeading").textContent = "Check your email";
        $("mfaLoginForm").querySelector("label").textContent = "Enter the verification code sent to your email";
      } else {
        $("authHeading").textContent = "Enter your authenticator code";
        $("mfaLoginForm").querySelector("label").textContent = "6-digit code from your authenticator app";
      }'''
          s = s.replace(old_heading, new_heading, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/index.html
          git commit -m "fix: align taxpayer MFA UI with server-selected method"
          git push
