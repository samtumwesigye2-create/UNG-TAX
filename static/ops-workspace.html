<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URA-PROMET Revenue Operations</title><link rel="stylesheet" href="/static/portals.css"><style>body{background:#eef1ed}.ops-shell{max-width:1220px;margin:0 auto;padding:18px}.panel{background:#fff;border:1px solid #d3d8d1;border-radius:12px;padding:16px;margin-bottom:14px}.authbox{max-width:520px;margin:40px auto}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.editor .wide{grid-column:1/-1}.editor input{width:100%;padding:9px 10px;border:1px solid #c7ccc4;border-radius:7px}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:#16304c;color:#fff}.secondary{background:#edf1f4;color:#16304c}.hidden{display:none!important}.muted{color:#6a7780;font-size:.84rem}.msg{padding:9px 11px;border-radius:7px;margin:8px 0;font-size:.86rem}.ok{background:#e9f3ed;color:#285d42}.err{background:#f7e8e5;color:#8c3127}.ops-nav{display:flex;gap:8px;overflow:auto;padding:10px 0 16px}.ops-nav button{white-space:nowrap}.top-actions{display:flex;gap:8px}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse}.data th,.data td{padding:9px;border-bottom:1px solid #e4e8e1;text-align:left}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .field{min-width:150px;flex:1}.toolbar input,.toolbar select,.editor select,.editor textarea{width:100%;padding:9px;border:1px solid #c7ccc4;border-radius:7px}.status{display:inline-block;border-radius:999px;padding:3px 8px;background:#edf1f4}.quick-actions{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:25px;text-align:center;color:#74808a}@media(max-width:680px){.editor{grid-template-columns:1fr}.editor .wide{grid-column:1}}</style></head><body><div class="top"><div><div class="brand">URA-PROMET</div><div class="sub">Revenue Operations</div></div></div><main class="ops-shell"><section id="authPanel" class="panel authbox hidden"><h2>Revenue sign in</h2><p class="muted">Revenue Staff and Revenue Admin only. MFA verification is required.</p><div id="loginPanel"><div class="editor"><div class="wide"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="wide"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div class="wide"><button class="btn primary" id="loginBtn">Sign in</button> <button class="btn secondary" id="forgotPasswordBtn" type="button">Forgot password</button></div></div></div><div id="resetPanel" class="hidden"><h3>Reset password</h3><div class="editor"><div class="wide"><label>Email</label><input id="resetEmail" type="email" autocomplete="email"></div><div class="wide"><button class="btn primary" id="sendResetBtn" type="button">Send reset code</button> <button class="btn secondary" id="cancelResetBtn" type="button">Back to sign in</button></div><div id="resetConfirmFields" class="wide hidden"><label>6-digit reset code</label><input id="resetCode" maxlength="6" inputmode="numeric"><label>New password</label><input id="resetPassword" type="password" autocomplete="new-password"><div style="margin-top:10px"><button class="btn primary" id="confirmResetBtn" type="button">Set new password</button></div></div></div><div id="resetMsg"></div></div><div id="mfaBox" class="hidden"><p id="mfaHelp" class="muted"></p><label>Verification code</label><input id="mfaCode" maxlength="6" inputmode="numeric"><div style="margin-top:10px"><button class="btn primary" id="verifyBtn">Verify MFA</button></div></div><div id="authMsg"></div></section><section id="workspace" class="hidden"><div class="hero"><div><h1 id="moduleTitle">Revenue Operations</h1><div id="moduleSub" class="sub" style="color:#66737d">Operational workspace</div></div><div class="top-actions"><span id="roleBadge" class="badge">Revenue Staff</span><button class="btn secondary" id="refreshBtn">Refresh</button><button class="btn secondary" id="signOutBtn">Sign out</button></div></div><nav class="ops-nav" id="moduleNav"></nav><div id="message"></div><section class="panel" id="controls"></section><section class="panel"><div class="table-wrap" id="results"></div></section></section></main><script src="/static/ops-workspace.js"></script><script src="/static/ops-password-reset.js"></script></body></html>
