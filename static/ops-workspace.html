<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>URA-PROMET Revenue Operations</title>
<link rel="stylesheet" href="/static/portals.css">
<style>
body{background:#eef1ed}.ops-shell{max-width:1220px;margin:0 auto;padding:18px}.ops-nav{display:flex;gap:8px;overflow:auto;padding:10px 0 16px}.ops-nav button{white-space:nowrap;border:1px solid #c7ccc4;background:#fff;color:#16304c;border-radius:8px;padding:9px 12px;font-weight:650}.ops-nav button.active{background:#16304c;color:#fff}.panel{background:#fff;border:1px solid #d3d8d1;border-radius:12px;padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.toolbar label{font-size:.78rem;color:#66737d;display:block;margin-bottom:4px}.toolbar input,.toolbar select,.editor input,.editor select,.editor textarea{width:100%;padding:9px 10px;border:1px solid #c7ccc4;border-radius:7px;background:#fff}.toolbar .field{min-width:150px;flex:1}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:#16304c;color:#fff}.secondary{background:#edf1f4;color:#16304c}.danger{background:#f3e6e3;color:#8a3027}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse;font-size:.88rem}.data th,.data td{text-align:left;padding:9px;border-bottom:1px solid #e4e8e1;vertical-align:top}.data th{color:#62707a;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em}.status{display:inline-block;border-radius:999px;padding:3px 8px;background:#edf1f4;font-size:.75rem}.editor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.editor .wide{grid-column:1/-1}.msg{padding:9px 11px;border-radius:7px;margin:8px 0;font-size:.86rem}.ok{background:#e9f3ed;color:#285d42}.err{background:#f7e8e5;color:#8c3127}.hidden{display:none!important}.authbox{max-width:520px;margin:40px auto}.authbox h2{margin-top:0}.top-actions{display:flex;gap:8px;align-items:center}.spacer{flex:1}.muted{color:#6a7780;font-size:.84rem}.money{font-variant-numeric:tabular-nums}.empty{padding:25px;text-align:center;color:#74808a}.quick-actions{display:flex;gap:6px;flex-wrap:wrap}.quick-actions button{font-size:.76rem;padding:6px 9px}
@media(max-width:680px){.ops-shell{padding:12px}.editor{grid-template-columns:1fr}.editor .wide{grid-column:1}.data{min-width:720px}.hero{align-items:flex-start}.top-actions{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top"><div><div class="brand">URA-PROMET</div><div class="sub">Revenue Operations</div></div></div>
<main class="ops-shell">
<section id="authPanel" class="panel authbox hidden">
<h2>Revenue sign in</h2><p class="muted">Revenue Staff and Revenue Admin only. MFA verification is required.</p>
<div class="editor"><div class="wide"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="wide"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><div class="wide"><button class="btn primary" id="loginBtn">Sign in</button></div></div>
<div id="mfaBox" class="hidden"><p id="mfaHelp" class="muted"></p><label>Verification code</label><input id="mfaCode" maxlength="6" inputmode="numeric"><div style="margin-top:10px"><button class="btn primary" id="verifyBtn">Verify MFA</button></div></div>
<div id="authMsg"></div>
</section>

<section id="workspace" class="hidden">
<div class="hero"><div><h1 id="moduleTitle">Revenue Operations</h1><div id="moduleSub" class="sub" style="color:#66737d">Operational workspace</div></div><div class="top-actions"><span id="roleBadge" class="badge">Revenue Staff</span><button class="btn secondary" id="refreshBtn">Refresh</button><button class="btn secondary" id="signOutBtn">Sign out</button></div></div>
<nav class="ops-nav" id="moduleNav"></nav>
<div id="message"></div>
<section class="panel" id="controls"></section>
<section class="panel"><div class="table-wrap" id="results"></div></section>
</section>
</main>
<script src="/static/ops-workspace.js"></script>
</body>
</html>
